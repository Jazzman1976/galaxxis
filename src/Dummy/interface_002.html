<!DOCTYPE html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="assets/styles/main.css">
    </head>
    <body>
        <div id="content">
            <div id="layer-background" class="layer-background-universe"></div>
            <div id="layer-foreground"></div>
            <div id="layer-inferface-background"></div>
            <div id="layer-interface">      
                <main>      
                    <h1>Universum</h1>
                    <h2>Galaxien in diesem Universum:</h2>
                    <div class="location-selection">
                        <button class="location-selection__prev" data-for="galaxie">&lt;</button>
                        <div class="select-wrapper">
                            <select id="galaxie">
                                <option selected>Andromeda</option>
                                <option>Barnards</option>
                                <option>Cetus</option>
                                <option>Draco</option>
                                <option>Eridanus</option>
                                <option>Fornax</option>
                            </select>
                        </div>
                        <button class="location-selection__next" data-for="galaxie">&gt;</button>
                        <a href="interface_003.html" class="button-link">GO</a>
                    </div>       
                    <div style="margin-top: 30px;">
                        <form id="my-form">
                            <label class="gx-form__label">
                                <span>E-Mail:</span>
                                <input class="gx-form__textbox" type="email" id="my-form-email" name="my-form-email" />
                            </label>
                            <label class="gx-form__label">
                                <span>Passwort:</span>
                                <input class="gx-form__textbox" type="password" id="my-form-email" name="my-form-email" />
                            </label>
                        </form>
                    </div>
                </main>    
            </div>
        </div>
        <script src="assets/scripts/perfect-scrollbar.js"></script>
        <script src="assets/scripts/main.js"></script>
    </body>
</html>
